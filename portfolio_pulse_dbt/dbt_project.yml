name: portfolio_pulse
version: "1.0.0"
config-version: 2

profile: portfolio_pulse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Schema where ingestion lands raw data. Airbyte's Postgres destination uses
  # the "Default Schema" you set when creating the destination ("public" unless changed).
  raw_schema: public

models:
  portfolio_pulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
