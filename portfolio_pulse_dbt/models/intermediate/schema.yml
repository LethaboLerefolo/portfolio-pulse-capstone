version: 2

models:
  - name: int_fx_daily
    description: >
      One USD->NGN rate for every calendar day from the first trade to today.
      rate_basis = observed | carried_forward | backfilled (see model header).
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: usd_ngn_rate
        data_tests: [not_null]
      - name: rate_basis
        data_tests: [not_null]

  - name: int_trades_enriched
    description: "Trades with NGN cost at the exchange rate on the purchase date."
    columns:
      - name: trade_id
        data_tests: [unique, not_null]
      - name: cost_ngn
        data_tests: [not_null]

  - name: int_daily_positions
    description: "Cumulative shares and cost basis per ticker per trading day, with the day's (or last known) close."
    columns:
      - name: close_price
        data_tests: [not_null]
      - name: shares_held
        data_tests: [not_null]
